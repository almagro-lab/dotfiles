# Barra de estado estilo powerline, con los colores de Ghostty.
# Requiere símbolos Nerd Font (Ghostty los trae como fallback).
#
# Paleta: bg #050B14 | fg #F5F7FA | verde #47FF9C | morado #9C8CFF
#         azul #0FC5ED | gris-azul #214969 | selección #12305A

set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status-style "fg=#F5F7FA,bg=#050B14"
set -g status-left-length 40
set -g status-right-length 120

# Sesión (izquierda)
set -g status-left "#[fg=#050B14,bg=#47FF9C,bold]  #S #[fg=#47FF9C,bg=#050B14,nobold] "

# Ventanas
set -g window-status-separator ""
set -g window-status-style "fg=#F5F7FA,bg=#050B14"
set -g window-status-format "#[fg=#F5F7FA,bg=#214969] #I  #W #[fg=#214969,bg=#050B14] "
set -g window-status-current-format "#[fg=#050B14,bg=#9C8CFF,bold] #I  #W #[fg=#9C8CFF,bg=#050B14,nobold] "

# Derecha: fecha/hora y tiempo
set -g status-right "#[fg=#12305A,bg=#050B14]#[fg=#F5F7FA,bg=#12305A]  %d/%m/%y %H:%M:%S #[fg=#0FC5ED,bg=#12305A]#[fg=#050B14,bg=#0FC5ED]  #(~/.config/tmux/weather.sh) "

# Paneles y mensajes
set -g pane-border-style "fg=#214969"
set -g pane-active-border-style "fg=#47FF9C"
set -g message-style "fg=#050B14,bg=#FFE073"
set -g mode-style "fg=#F5F7FA,bg=#12305A"
